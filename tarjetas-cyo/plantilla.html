<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjeta C&amp;O</title>
<style>
/*FUENTES*/

/* Tarjeta 90 × 50 mm + 3 mm de sangrado por lado = 96 × 56 mm por cara */
:root{
  --negro:#0E0E0E; --carbon:#1C1714; --marfil:#F4E7CB;
  --laton:#AA8B64; --champan:#CDBEA3; --bronce:#685C4B; --oliva:#4B511E;
  --sangrado:3mm; --seguridad:4.5mm;
  --fondo-pantalla:#D9D3C6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fondo-pantalla:#2A2723}}
:root[data-theme="dark"]{--fondo-pantalla:#2A2723}

@page{size:96mm 56mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{background:var(--fondo-pantalla)}

.cara{
  position:relative;width:96mm;height:56mm;overflow:hidden;
  break-after:page;page-break-after:always;
}
.cara:last-child{break-after:auto;page-break-after:auto}
/* área útil: corte (3 mm) + margen de seguridad */
.util{position:absolute;inset:calc(var(--sangrado) + var(--seguridad))}
.monograma{display:block;aspect-ratio:4256/2272;height:auto}

/* ---------- FRENTE: negro mate ---------- */
.frente{background:var(--negro)}
.frente .ciudad{position:absolute;left:0;bottom:0;width:96mm;height:20mm;display:block}
.frente .util{bottom:auto;height:25mm;top:calc(var(--sangrado) + 7mm);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.frente .monograma{width:33mm;color:#FFFFFF}
.frente .lema{
  margin-top:4.2mm;
  font:500 5pt/1 'Jost',sans-serif;letter-spacing:.3em;text-transform:uppercase;
  color:#FFFFFF;padding-left:.3em;white-space:nowrap;
}

/* ---------- REVERSO ---------- */
.reverso{background:var(--marfil);color:var(--carbon)}
.reverso .util{display:grid;grid-template-columns:1fr auto;column-gap:4mm;align-items:stretch}
.reverso .datos{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.reverso .monograma{width:12mm;color:var(--carbon)}
.reverso h2{font:300 italic 14pt/1 'Inria Serif',serif;letter-spacing:-.01em;margin-top:2.4mm}
.reverso .canal{
  font:600 4.4pt/1 'Jost',sans-serif;letter-spacing:.26em;text-transform:uppercase;
  color:var(--bronce);margin-top:2.6mm;
}
.reverso .tel{font:500 9pt/1 'DM Mono',monospace;letter-spacing:.02em;margin-top:1.3mm;white-space:nowrap}
.reverso .contacto{display:flex;flex-direction:column;gap:1.5mm}
.reverso .redes{display:flex;align-items:center;gap:1.1mm;white-space:nowrap}
.reverso .icono{width:2.5mm;height:2.5mm;flex:none;color:var(--carbon)}
.reverso .usuario{margin-left:.6mm;font:500 5.2pt/1 'Jost',sans-serif;letter-spacing:.01em}
.reverso .correo{font:400 5.2pt/1 'Jost',sans-serif;letter-spacing:.02em;color:var(--bronce)}
.reverso .bloque-qr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6mm}
.reverso .ficha-qr{background:#FFFFFF;border-radius:1.4mm;padding:.5mm;box-shadow:0 0 0 .18mm var(--laton)}
.reverso .qr{display:block;width:23mm;height:23mm}
.reverso .escanea{
  font:600 4.2pt/1 'Jost',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--oliva);padding-left:.28em;
}
.reverso .banda{position:absolute;left:0;right:0;bottom:0;height:calc(var(--sangrado) + 1.2mm);background:var(--oliva)}

/* ---------- Vista en pantalla (no se imprime) ---------- */
@media screen{
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px 16px}
  .mesa{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;zoom:1.9}
  .cara{box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 28px rgba(0,0,0,.22);border-radius:1mm;
        clip-path:inset(var(--sangrado) round .8mm)}
  .nota{font:400 13px/1.5 'Jost',sans-serif;color:#685C4B;text-align:center;max-width:640px}
  .nota a{color:#4B511E}
}
@media screen and (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nota{color:#CDBEA3}:root:not([data-theme="light"]) .nota a{color:#DCDA9E}}
@media screen and (max-width:760px){.mesa{zoom:1}}
@media screen and (max-width:420px){.mesa{zoom:.86}}
@media print{.nota{display:none}.mesa{display:block}}
</style>
</head>
<body>
<div class="mesa">
  <section class="cara frente" aria-label="Frente">
    <!--CIUDAD-->
    <div class="util">
      <!--LOGO-->
      <div class="lema">La Casa del Marketing Inmobiliario</div>
    </div>
  </section>

  <section class="cara reverso" aria-label="Reverso">
    <div class="util">
      <div class="datos">
        <div>
          <!--LOGO-->
          <h2>Hablemos.</h2>
          <div class="canal">WhatsApp</div>
          <div class="tel">__TELEFONO__</div>
        </div>
        <div class="contacto">
          <div class="redes">
            <!--INSTAGRAM--><!--TIKTOK--><!--FACEBOOK-->
            <span class="usuario">__USUARIO__</span>
          </div>
          <div class="correo">__CORREO__</div>
        </div>
      </div>
      <div class="bloque-qr">
        <div class="ficha-qr"><!--QR--></div>
        <div class="escanea">Ver portafolio</div>
      </div>
    </div>
    <div class="banda"></div>
  </section>
</div>
<p class="nota">Tarjeta 90 × 50 mm · archivo de impresión con 3 mm de sangrado. El QR abre <a href="__ENLACE__">__ENLACE__</a>: es estático, no pasa por ningún servicio de redirección y no se vence.</p>
</body>
</html>
