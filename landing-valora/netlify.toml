# Landing de conversión Valora Energy. Configurar en Netlify:
#   Base directory: landing-valora
#   Los leads llegan a Netlify > Forms > "lead-valora" (activar notificaciones por correo allí)
[build]
  publish = "."

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
