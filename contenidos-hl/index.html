  /* Capas: fondo de metal champán fijo → placas de vidrio líquido que lo refractan. Hero oliva con lente de vidrio para el medidor. */
  :root {
    --ink: #121212;
    --ivory: #f4e7cb;
    --champagne: #cdbea3;
    --bronze: #685c4b;
    --olive-gold: #9f9d5f;

    --sanguine: #8b361c;

    --ui: "Manrope", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  button, input, select { font: inherit; color: inherit; }

  .wrap { max-width: 1160px; margin: 0 auto; padding-inline: 24px; padding-block: 20px 0; }
  .label { font-family: var(--ui); font-size: 11px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }

  /* ---------- vidrio líquido ---------- */
  .glass {
    position: relative; isolation: isolate;
    border-radius: 34px;
    background: linear-gradient(145deg, rgba(255,255,255,.58), rgba(255,255,255,.16) 55%, rgba(255,255,255,.32));
    -webkit-backdrop-filter: blur(24px) saturate(175%) brightness(1.05);
    backdrop-filter: blur(24px) saturate(175%) brightness(1.05);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.95),
      inset 0 -1px 2px rgba(104,92,75,.10),
      inset 0 0 28px rgba(255,255,255,.28),
      0 1px 2px rgba(60,48,30,.06),
      0 34px 70px -38px rgba(60,48,30,.55);
  }
  /* borde de luz */
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.2px; pointer-events: none; z-index: 2;
    background: linear-gradient(140deg, rgba(255,255,255,1), rgba(255,255,255,.1) 30%, rgba(255,255,255,0) 55%, rgba(255,255,255,.75) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  /* brillo especular */
  .glass::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
    background:
      radial-gradient(120% 70% at 12% -10%, rgba(255,255,255,.55), transparent 55%),
      radial-gradient(80% 50% at 100% 110%, rgba(255,250,235,.35), transparent 60%);
  }
  .glass.dark {
    background: linear-gradient(150deg, rgba(244,231,203,.16), rgba(20,22,10,.28) 50%, rgba(244,231,203,.08));
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    backdrop-filter: blur(20px) saturate(150%);
    box-shadow:
      inset 0 1px 1px rgba(255,240,205,.55),
      inset 0 0 40px rgba(244,231,203,.06),
      0 0 60px -12px rgba(210,180,110,.35),
      0 40px 80px -40px rgba(0,0,0,.7);
  }
  .glass.dark::before { background: var(--gold-rim); padding: 1.5px; }
  .glass.dark::after { background: radial-gradient(100% 60% at 15% -5%, rgba(255,245,215,.28), transparent 55%); }

  /* ---------- barra superior ---------- */
  .nav {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 10px 14px 10px 10px; border-radius: 999px;
  }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .logo { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex: none; background: var(--ink); box-shadow: 0 4px 12px -4px rgba(0,0,0,.4); }
  .logo img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.07); display: block; }
  .lockup .rule { width: 1px; height: 34px; background: var(--ink); opacity: .7; }
  .lockup span { font-family: var(--display); font-size: 18px; line-height: 1.05; font-weight: 500; max-width: 170px; }
  .client { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); padding-right: 8px; }
  .client b { color: var(--ink); font-weight: 600; }

  }
  .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(95deg, rgba(8,9,4,.72) 10%, rgba(8,9,4,.25) 60%, rgba(8,9,4,.05)); }
  .hero::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: var(--gold-rim); opacity: .7; pointer-events: none;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  .hero-inner { position: relative; z-index: 1; display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(28px, 4vw, 56px); align-items: center; }
  .hero .label { color: var(--champagne); display: flex; align-items: center; gap: 14px; }
  .hero .label::before { content: ""; width: 36px; height: 1px; background: linear-gradient(90deg, transparent, var(--champagne)); }
  h1 { font-family: var(--display); font-weight: 300; font-size: clamp(46px, 6.4vw, 92px); line-height: .92; letter-spacing: -.015em; margin: 26px 0 22px; text-wrap: balance; }
  h1 em { font-style: italic; font-weight: 300; color: var(--champagne); }
  .lede { color: rgba(244,231,203,.72); max-width: 420px; font-size: 15px; }

  .switch { display: inline-flex; align-items: center; gap: 6px; margin-top: 34px; padding: 6px; border-radius: 999px; }
  .switch h2 { font-family: var(--display); font-weight: 400; font-size: 24px; min-width: 200px; text-align: center; letter-spacing: .01em; }
  .orb { width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; color: var(--ivory); font-size: 16px;
    background: radial-gradient(circle at 35% 30%, rgba(255,245,220,.35), rgba(244,231,203,.08) 60%); box-shadow: inset 0 1px 1px rgba(255,245,220,.5); transition: background .3s, color .3s; }
  .orb:hover:not(:disabled) { background: var(--ivory); color: var(--ink); }
  .orb:disabled { opacity: .28; cursor: not-allowed; }
  .meta { margin-top: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: rgba(244,231,203,.82); }
  .meta .dot { width: 7px; height: 7px; border-radius: 50%; background: #d9c48f; box-shadow: 0 0 12px #d9c48f; flex: none; }
  .meta.closed .dot { background: var(--champagne); box-shadow: none; }
  .meta.future .dot { background: transparent; border: 1px solid var(--champagne); box-shadow: none; }
  .link { margin-top: 10px; background: none; border: 0; padding: 0; color: var(--champagne); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }

  /* lente circular del medidor */
  .lens { position: relative; width: min(400px, 100%); aspect-ratio: 1; max-width: 100%; justify-self: center; border-radius: 50%; display: grid; place-items: center; }
  .lens .glass.dark { position: absolute; inset: 0; border-radius: 50%; }
  .gauge { position: relative; z-index: 3; width: 84%; aspect-ratio: 1; }
  .gauge svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .seg { fill: none; stroke-width: 11; stroke-linecap: round; stroke: rgba(244,231,203,.13); transition: stroke .6s ease, filter .6s ease; }
  .seg.on { stroke: url(#gold); filter: drop-shadow(0 0 5px rgba(230,200,120,.55)); }
  .seg.sched { stroke: rgba(217,196,143,.45); stroke-dasharray: 3 4; stroke-linecap: butt; }
  .readout { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .pct { font-family: var(--display); font-weight: 300; font-size: clamp(76px, 10vw, 118px); line-height: .9; letter-spacing: -.03em; font-variant-numeric: lining-nums; }
  .pct small { font-size: .36em; font-style: italic; color: var(--champagne); margin-left: 3px; }
  .readout .label { justify-content: center; color: rgba(244,231,203,.7); margin-top: 10px; letter-spacing: .2em; }
  .readout .label::before { display: none; }
  .badge { margin-top: 16px; justify-self: center; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(244,231,203,.35); color: var(--ivory); background: rgba(244,231,203,.06); }
  .badge.full { background: linear-gradient(135deg, #f4e7cb, #d9c48f); color: var(--olive); border-color: transparent; }

  /* ---------- secciones ---------- */
  section { margin-top: 84px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
  .title { font-family: var(--display); font-weight: 300; font-size: clamp(38px, 5vw, 60px); line-height: 1; letter-spacing: -.01em; text-wrap: balance; }
  .title em { font-style: italic; color: var(--olive); }

  .pack { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; }
  .panel { padding: clamp(22px, 3vw, 36px); }
  .panel > .label { display: block; margin-bottom: 22px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 30px; }
  .stat { padding: 4px 0 4px 22px; border-left: 1px solid var(--hair); }
  .stat:first-child { padding-left: 0; border-left: 0; }
  .stat b { display: block; font-family: var(--display); font-weight: 300; font-size: clamp(46px, 5vw, 64px); line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
  .stat b.hl { color: var(--olive); font-style: italic; }
  .stat span { font-size: 12px; color: var(--muted); }

  .slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .slot { position: relative; aspect-ratio: 1; border-radius: 16px; display: grid; place-items: center; font-family: var(--display); font-size: 19px; color: rgba(104,92,75,.55);
    background: rgba(255,255,255,.22); box-shadow: inset 0 1px 3px rgba(104,92,75,.14), inset 0 -1px 1px rgba(255,255,255,.7); transition: transform .4s; }
  .slot.done { color: var(--ivory); font-style: italic;
    background: radial-gradient(120% 120% at 30% 20%, #8c9244 0%, var(--olive) 45%, #2c300d 100%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.45), inset 0 -6px 12px rgba(0,0,0,.25), 0 10px 18px -10px rgba(45,50,15,.9); }
  .slot.done::after { content: ""; position: absolute; top: 8%; left: 14%; width: 46%; height: 26%; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.5), transparent 70%); filter: blur(1px); }
  .slot.done.sched { color: var(--olive);
    background: linear-gradient(145deg, rgba(255,252,240,.7), rgba(217,196,143,.35));
    box-shadow: inset 0 0 0 1px rgba(184,163,106,.8), inset 0 1px 1px rgba(255,255,255,.9); }
  .slot.done.sched::after { display: none; }
  .slot.pop { animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(.5); } 100% { transform: scale(1); } }
  .legend { margin-top: 16px; font-size: 12px; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend .l-done { background: var(--olive); }
  .legend .l-sched { background: rgba(217,196,143,.5); box-shadow: inset 0 0 0 1px #b8a36a; }

  .types { display: grid; gap: 18px; }
  .type { display: grid; grid-template-columns: 104px 1fr 28px; gap: 14px; align-items: center; }
  .type span { font-family: var(--display); font-size: 21px; }
  .tube { height: 12px; border-radius: 99px; background: rgba(255,255,255,.3); box-shadow: inset 0 1px 3px rgba(104,92,75,.2), inset 0 -1px 1px rgba(255,255,255,.8); overflow: hidden; }
  .tube i { display: block; height: 100%; border-radius: 99px; transition: width .8s cubic-bezier(.2,.8,.2,1);
    background-image: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%); }
  .type b { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
  .note-line { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--muted); }

  /* ---------- registro ---------- */
  form { display: grid; grid-template-columns: 2fr 1fr auto 1.1fr auto; gap: 14px; align-items: end; padding: clamp(20px, 3vw, 30px); }
  .pill-check { position: relative; display: inline-flex; align-items: center; gap: 9px; height: 52px; padding: 0 18px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--bronze);
    background: rgba(255,255,255,.42); box-shadow: inset 0 1px 3px rgba(104,92,75,.18), inset 0 -1px 1px rgba(255,255,255,.9); transition: background .25s, color .25s; }
  .pill-check input { position: absolute; opacity: 0; pointer-events: none; }
  .pill-check i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--sanguine); transition: background .25s; }
  .pill-check:has(input:checked) { background: var(--sanguine); color: #fff; box-shadow: inset 0 1px 1px rgba(255,255,255,.35), 0 8px 16px -10px rgba(139,54,28,.9); }
  .pill-check:has(input:checked) i { background: #fff; box-shadow: none; }
  .pill-check:has(input:focus-visible) { outline: 2px solid var(--olive); outline-offset: 3px; }
  .tags { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ad-tag { border: 1px solid rgba(139,54,28,.5); background: none; border-radius: 999px; padding: 4px 10px; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--sanguine); white-space: nowrap; }
  .ad-tag.on { background: var(--sanguine); border-color: var(--sanguine); color: #fff; }
  button.ad-tag { cursor: pointer; transition: background .2s, color .2s; }
  button.ad-tag:not(.on) { border-style: dashed; opacity: .75; }
  button.ad-tag:hover { opacity: 1; background: rgba(139,54,28,.1); }
  button.ad-tag.on:hover { background: #a3421f; }
  .type.ads { margin-top: 4px; padding-top: 18px; border-top: 1px solid var(--hair); }
  label { display: grid; gap: 9px; min-width: 0; }
  .field { width: 100%; min-width: 0; border: 0; border-radius: 16px; padding: 15px 18px; font-size: 16px; outline: none;
    background: rgba(255,255,255,.42); box-shadow: inset 0 1px 3px rgba(104,92,75,.18), inset 0 -1px 1px rgba(255,255,255,.9); transition: box-shadow .2s; color-scheme: light; }
  .field:focus { box-shadow: inset 0 1px 3px rgba(104,92,75,.18), 0 0 0 2px rgba(75,81,30,.45); }
  .cta { position: relative; border: 0; border-radius: 999px; padding: 16px 30px; cursor: pointer; white-space: nowrap;
    font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ivory);
    background: radial-gradient(120% 140% at 30% 0%, #3a3a33, var(--ink) 60%);
    box-shadow: inset 0 1px 1px rgba(255,245,220,.35), 0 0 0 1px rgba(184,163,106,.6), 0 14px 24px -14px rgba(0,0,0,.8); transition: background .3s, transform .2s; }
  .cta:hover:not(:disabled) { background: radial-gradient(120% 140% at 30% 0%, #6d7431, var(--olive) 60%); transform: translateY(-1px); }
  .cta:disabled { opacity: .45; cursor: not-allowed; }
  .msg { min-height: 22px; margin: 14px 6px 0; font-size: 13px; color: var(--bronze); }
  .msg.warn { color: var(--sanguine); font-weight: 600; }
  .unlock { display: grid; grid-template-columns: 1fr minmax(0, 260px) auto; gap: 14px; align-items: end; padding: clamp(18px, 2.6vw, 26px); }
  .unlock p { font-family: var(--display); font-size: 21px; line-height: 1.2; }
  .unlock p small { display: block; font-family: var(--ui); font-size: 13px; color: var(--muted); margin-top: 4px; }
  .lock-out { background: none; border: 0; padding: 0; margin: 12px 6px 0; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  .list { margin-top: 18px; padding: 8px clamp(14px, 2.4vw, 28px); }
  .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 210px 158px 34px; gap: 18px; align-items: center; padding: 16px 0; }
  .row .tags { justify-content: flex-start; }
  .row .chip { min-width: 98px; }
  .row time { text-align: right; }
  .row + .row { border-top: 1px solid var(--hair); }
  .row .n { font-family: var(--display); font-style: italic; font-size: 24px; color: var(--olive); }
  .row .t { font-family: var(--display); font-size: 21px; line-height: 1.2; overflow-wrap: anywhere; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--bronze); white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; }
  .row time { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row time .sched { color: var(--olive); font-weight: 600; }
  .x { width: 34px; height: 34px; border-radius: 50%; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; }
  .x:hover { color: var(--sanguine); background: rgba(139,54,28,.08); }
  .confirm { grid-column: 3 / -1; display: flex; gap: 8px; align-items: center; justify-content: flex-end; font-size: 13px; }
  .confirm button { border: 0; border-radius: 999px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .confirm .yes { background: var(--sanguine); color: #fff; }
  .confirm .no { background: rgba(104,92,75,.12); }
  .empty { padding: 34px 6px; text-align: center; font-family: var(--display); font-style: italic; font-size: 22px; color: var(--bronze); }

  /* ---------- histórico ---------- */
  .summary { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
  .summary b { font-family: var(--display); font-style: italic; font-weight: 400; font-size: 26px; color: var(--olive); }
  .scroll { overflow-x: auto; }
  .history { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(64px, 1fr); gap: 18px; height: 280px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; height: 100%; justify-content: flex-end; cursor: pointer; border-radius: 12px; }
  .col .v { font-family: var(--display); font-size: 22px; color: var(--muted); font-variant-numeric: lining-nums; }
  .col .bar { position: relative; width: 100%; max-width: 70px; flex: 1; border-radius: 999px; overflow: hidden;
    background: rgba(255,255,255,.28); box-shadow: inset 0 2px 5px rgba(104,92,75,.2), inset 0 -1px 1px rgba(255,255,255,.8); }
  .col .bar i { position: absolute; left: 3px; right: 3px; bottom: 3px; border-radius: 999px; transition: height .9s cubic-bezier(.2,.8,.2,1);
    background: linear-gradient(90deg, rgba(255,255,255,.4), rgba(255,255,255,0) 45%), linear-gradient(180deg, #e3d7bb, var(--champagne)); }
  .col.on .bar i { background: linear-gradient(90deg, rgba(255,255,255,.45), rgba(255,255,255,0) 45%), linear-gradient(180deg, var(--olive-gold), var(--olive)); box-shadow: 0 0 16px rgba(75,81,30,.35); }
  .col.on .v { color: var(--olive); font-style: italic; }
  .col .m { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .col:hover .m, .col.on .m { color: var(--ink); }

  footer { margin-top: 96px; padding: 30px 0 48px; border-top: 1px solid var(--hair); display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  .sync { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 9px; }
  .sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--champagne); flex: none; }
  .sync.live::before { background: var(--olive); box-shadow: 0 0 8px var(--olive-gold); }

  button:focus-visible, .field:focus-visible, .col:focus-visible { outline: 2px solid var(--olive); outline-offset: 3px; }
  .hero button:focus-visible { outline-color: var(--ivory); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  /* ---------- responsive ---------- */
  @media (max-width: 940px) {
    .row { grid-template-columns: 36px minmax(0, 1fr) 34px; row-gap: 6px; }
    .row .tags, .row time { grid-column: 2; }
    .row time { text-align: left; }
    .row .x { grid-row: 1; grid-column: 3; }
    .confirm { grid-column: 1 / -1; justify-content: flex-start; }
    .hero-inner, .pack { grid-template-columns: 1fr; }
    .lens { width: min(360px, 100%); }
    form { grid-template-columns: 1fr 1fr; }
    form label:first-child, form .cta { grid-column: 1 / -1; }
  }
  @media (max-width: 560px) {
    .wrap { padding-inline: 16px; }
    .client { display: none; }
    .lockup span { font-size: 16px; }
    .hero { border-radius: 30px; margin-top: 20px; }
    .switch h2 { min-width: 0; font-size: 20px; padding: 0 6px; }
    form { grid-template-columns: 1fr; }
    .stat { padding-left: 12px; }
    .slots { gap: 7px; }
    .slot { border-radius: 12px; font-size: 16px; }
    .type { grid-template-columns: 84px 1fr 22px; }
    .type span { font-size: 18px; }
    .row { grid-template-columns: 30px minmax(0, 1fr) 34px; row-gap: 6px; }
    .row .tags, .row time { grid-column: 2; }
    .row time { text-align: left; }
    .row .x { grid-row: 1; grid-column: 3; }
    .confirm { grid-column: 1 / -1; justify-content: flex-start; }
    .unlock { grid-template-columns: 1fr; }
    .history { gap: 10px; height: 230px; grid-auto-columns: minmax(46px, 1fr); }
    .col .v { font-size: 17px; }
    .col .m { letter-spacing: .08em; font-size: 10px; }
  }
</style>
</head>

  const PAGE_HEAD = '<title>Contenidos HL · C&amp;O</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">';
  const RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif;background:#fafaf8}img{max-width:100%}[hidden]{display:none!important}';

  // ---------- montar ----------
  const tpl = document.getElementById("tpl");
  document.getElementById("app").appendChild(tpl.content.cloneNode(true));
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const isoOf = (d) => `${keyOf(d)}-${pad(d.getDate())}`;
  const monthIndex = (d) => d.getFullYear() * 12 + d.getMonth();
  const daysIn = (d) => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const colorOf = (t) => (TYPES.find((x) => x.name === t) || TYPES[2]).color;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clean = (arr) => (Array.isArray(arr) ? arr : []).filter((x) => x && typeof x.id === "string" && typeof x.title === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x.date));

  // ---------- estado ----------
  let embedded = [];
  try { embedded = clean(JSON.parse($("data").textContent)); } catch {}
  let items = embedded;
  let mode = "pending";     // "artifact" publicado | "local" archivo abierto en el navegador
  let art = null;
  let canWrite = null;      // null mientras se confirma el permiso
  let saving = false;
  let editKey = "";
  let pendingDelete = null;
  let msg = { text: "", warn: false };
  let pop = null;
  let today = new Date();
  let view = new Date(today.getFullYear(), today.getMonth(), 1);

  // al volver a cargar tras guardar, regresar al mes donde se trabajaba
  try {
    const s = JSON.parse(sessionStorage.getItem(STASH_KEY) || "null");
    sessionStorage.removeItem(STASH_KEY);
    if (s && /^\d{4}-\d{2}$/.test(s.view)) { const [y, m] = s.view.split("-").map(Number); view = new Date(y, m - 1, 1); pop = s.pop || null; }
  } catch {}
  if (monthIndex(view) < monthIndex(CONTRACT_START)) view = new Date(CONTRACT_START);

  $("fType").innerHTML = TYPES.map((t) => `<option>${t.name}</option>`).join("");

  // ---------- medidor de 18 segmentos ----------
  const R = 86, GAP = 4.2;
  const pt = (deg) => { const a = (deg - 90) * Math.PI / 180; return `${(100 + R * Math.cos(a)).toFixed(2)} ${(100 + R * Math.sin(a)).toFixed(2)}`; };
  $("segments").innerHTML = Array.from({ length: MONTHLY_TOTAL }, (_, i) => {
    const step = 360 / MONTHLY_TOTAL;
    return `<path class="seg" d="M ${pt(i * step + GAP / 2)} A ${R} ${R} 0 0 1 ${pt((i + 1) * step - GAP / 2)}"></path>`;
  }).join("");
  const segs = [...document.querySelectorAll(".seg")];

  let shownPct = 0;
  function animateNumber(to) {
    const from = shownPct, start = performance.now(), dur = 1000;
    shownPct = to;
    const step = (t) => {
      const p = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - p, 3);
      $("pct").innerHTML = `${Math.round(from + (to - from) * e)}<small>%</small>`;
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  const monthItems = (k) => items.filter((x) => x.date.slice(0, 7) === k)
    .sort((a, b) => a.date.localeCompare(b.date) || String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
  const phaseOf = (d) => Math.sign(monthIndex(d) - monthIndex(today)); // -1 pasado, 0 en curso, 1 futuro
  const isSched = (x) => x.date > isoOf(today);

  // ---------- render ----------
  function render() {
    today = new Date();
    const k = keyOf(view);
    const list = monthItems(k);
    const used = list.length;
    const sched = list.filter(isSched).length;
    const pct = Math.round((Math.min(used, MONTHLY_TOTAL) / MONTHLY_TOTAL) * 100);
    const phase = phaseOf(view);
    const name = MONTHS[view.getMonth()];
    const lower = name.toLowerCase();
    const next = MONTHS[(view.getMonth() + 1) % 12].toLowerCase();

    $("monthLabel").textContent = `${name} ${view.getFullYear()}`;
    $("prev").disabled = monthIndex(view) <= monthIndex(CONTRACT_START);
    $("today").hidden = phase === 0;

    // medidor: sólidos = publicados, punteados = programados
    segs.forEach((s, i) => {
      s.style.transitionDelay = `${i * 40}ms`;
      const it = list[i];
      s.classList.toggle("on", !!it && !isSched(it));
      s.classList.toggle("sched", !!it && isSched(it));
    });
    animateNumber(pct);
    $("countLabel").textContent = `${used} de ${MONTHLY_TOTAL} contenidos`;
    const badge = $("badge");
    badge.classList.toggle("full", used >= MONTHLY_TOTAL);
    badge.textContent = used >= MONTHLY_TOTAL ? "Paquete completo"
      : phase < 0 ? `Cerró con ${MONTHLY_TOTAL - used} sin usar`
      : used === 0 ? "Sin contenidos aún"
      : `Quedan ${MONTHLY_TOTAL - used}`;

    const left = daysIn(view) - today.getDate();
    $("meta").className = "meta" + (phase < 0 ? " closed" : phase > 0 ? " future" : "");
    $("metaText").textContent =
      phase === 0 ? (left === 0 ? `Hoy cierra ${lower}. Mañana arranca el conteo de ${next}.`
                                : `Mes en curso · ${left === 1 ? "falta 1 día" : `faltan ${left} días`} para cerrar. El 1 de ${next} arranca de cero.`)
      : phase < 0 ? `Mes cerrado · se usaron ${used} de ${MONTHLY_TOTAL} contenidos.`
      : `Mes por empezar · lo registrado aquí queda programado.`;

    // cifras y casillas
    $("sUsed").textContent = used;
    $("sLeft").textContent = Math.max(0, MONTHLY_TOTAL - used);
    $("sDays").textContent = phase === 0 ? left : phase < 0 ? 0 : daysIn(view);
    $("sDaysLabel").textContent = phase === 0 ? "Días para cerrar" : phase < 0 ? "Mes cerrado" : "Días del mes";
    $("slots").innerHTML = Array.from({ length: MONTHLY_TOTAL }, (_, i) => {
      const it = list[i];
      const cls = it ? `slot done${isSched(it) ? " sched" : ""}${it.id === pop ? " pop" : ""}` : "slot";
      return `<div class="${cls}" title="${it ? esc(it.title) : "Disponible"}">${i + 1}</div>`;
    }).join("");
    $("legendCount").textContent = used ? `${used - sched} ${used - sched === 1 ? "publicado" : "publicados"} · ${sched} ${sched === 1 ? "programado" : "programados"}` : "";

    $("types").innerHTML = TYPES.map((t) => {
      const n = list.filter((x) => x.type === t.name).length;
      return `<div class="type"><span>${t.name}</span><div class="tube"><i style="width:${(n / MONTHLY_TOTAL) * 100}%;background-color:${t.color}"></i></div><b>${n}</b></div>`;
    }).join("");
    const adsN = list.filter((x) => x.ads).length;
    $("types").insertAdjacentHTML("beforeend", `<div class="type ads"><span>Pautados</span><div class="tube"><i style="width:${(adsN / MONTHLY_TOTAL) * 100}%;background-color:#8b361c"></i></div><b>${adsN}</b></div>`);
    $("typesNote").textContent = `${pct}% del paquete de ${MONTHLY_TOTAL} piezas usado en ${lower} ${view.getFullYear()}.`;

    // lista
    const writable = canWrite === true && !saving;
    $("list").innerHTML = list.length
      ? list.map((x, i) => `
        <div class="row">
          <span class="n">${pad(i + 1)}</span>
          <span class="t">${esc(x.title)}</span>
          ${pendingDelete === x.id
            ? `<div class="confirm"><span>¿Eliminar este contenido?</span><button class="yes" data-yes="${esc(x.id)}">Eliminar</button><button class="no" data-no>Cancelar</button></div>`
            : `<span class="tags"><span class="chip"><i style="background:${colorOf(x.type)}"></i>${esc(x.type)}</span>${
                 writable ? `<button class="ad-tag${x.ads ? " on" : ""}" data-ad="${esc(x.id)}" aria-pressed="${!!x.ads}" title="${x.ads ? "Quitar pauta" : "Marcar como pautado"}">${x.ads ? "Pautado" : "+ Pauta"}</button>`
                 : x.ads ? `<span class="ad-tag on">Pautado</span>` : ""}</span>
               <time>${isSched(x) ? '<span class="sched">Programado · </span>' : ""}${new Date(x.date + "T12:00").toLocaleDateString("es-CO", { day: "numeric", month: "short" })}</time>
               ${writable ? `<button class="x" data-id="${esc(x.id)}" aria-label="Eliminar ${esc(x.title)}">×</button>` : "<span></span>"}`}
        </div>`).join("")
      : `<div class="empty">No hay contenidos registrados en ${lower}.</div>`;

    // formulario
    $("form").hidden = canWrite !== true;
    const fDate = $("fDate");
    if (!fDate.value) fDate.value = phase === 0 ? isoOf(today) : `${k}-01`;
    [...$("form").elements].forEach((el) => (el.disabled = saving));
    $("addBtn").textContent = saving ? "Guardando…" : "Sumar contenido";
    const m = $("msg");
    m.className = "msg" + (msg.warn ? " warn" : "");
    m.textContent = msg.text || (canWrite === false && mode === "artifact" ? "Vista de solo lectura: el conteo se actualiza cuando C&O registra contenidos." : "");
    $("unlock").hidden = !(mode === "remote" && canWrite !== true);
    $("lockOut").hidden = !(mode === "remote" && canWrite === true);

    // pie
    const sync = $("sync");
    sync.classList.toggle("live", mode === "artifact" || mode === "remote");
    sync.textContent = mode === "artifact" || mode === "remote" ? "Conteo compartido · todos los que abren el link ven lo mismo"
      : mode === "local" ? "Archivo local · se guarda solo en este navegador" : "Cargando…";

    renderHistory();
    pop = null;
  }

  function renderHistory() {
    const last = Math.max(monthIndex(today), monthIndex(view));
    const cols = [];
    for (let mi = monthIndex(CONTRACT_START); mi <= last; mi++) {
      const d = new Date(Math.floor(mi / 12), mi % 12, 1);
      const n = monthItems(keyOf(d)).length;
      const p = Math.round((Math.min(n, MONTHLY_TOTAL) / MONTHLY_TOTAL) * 100);
      cols.push(`<div class="col${mi === monthIndex(view) ? " on" : ""}" role="button" tabindex="0" data-mi="${mi}" aria-label="${MONTHS[d.getMonth()]} ${d.getFullYear()}: ${n} de ${MONTHLY_TOTAL}">
        <span class="v">${p}%</span><div class="bar"><i style="height:calc(${p}% - ${p ? 6 : 0}px)"></i></div><span class="m">${MONTHS[d.getMonth()].slice(0, 3)}</span></div>`);
    }
    $("history").innerHTML = cols.join("");
    const months = monthIndex(today) - monthIndex(CONTRACT_START) + 1;
    const usedAll = items.filter((x) => { const [y, mo] = x.date.split("-").map(Number); const mi = y * 12 + mo - 1; return mi >= monthIndex(CONTRACT_START) && mi <= monthIndex(today); }).length;
    const total = months * MONTHLY_TOTAL;
    $("summary").innerHTML = `Desde julio 2026 · ${months} ${months === 1 ? "mes" : "meses"} de contrato: <b>${usedAll} de ${total}</b> contenidos (${Math.round((usedAll / total) * 100)}%)`;
  }

  // ---------- guardado ----------
  function buildDoc(list) {
    const json = JSON.stringify(list).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
      + PAGE_HEAD
      + '<style id="css">' + $("css").textContent + '</style>'
      + '<template id="tpl">' + tpl.innerHTML + '</template>'
      + '<div id="app"></div>'
      + '<script type="application/json" id="data">' + json + '<\/script>'
      + '<script id="app-js">' + $("app-js").textContent + '<\/script>'
      + '</body></html>';
  }

  async function commit(op, nextItems, focusKey, popId) {
    msg = { text: "", warn: false };
    if (mode === "remote") {
      const prev = items, prevView = view;
      items = nextItems; saving = true;
      if (focusKey) { const [y, m] = focusKey.split("-").map(Number); view = new Date(y, m - 1, 1); }
      pop = popId; render();
      try {
        const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...op, key: editKey }) });
        if (r.status === 401) {
          items = prev; view = prevView; lock();
          msg = { text: "La clave del equipo cambió. Vuelve a ingresarla para registrar contenidos.", warn: true };
        } else if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          items = prev; view = prevView;
          msg = { text: j.error || "No se pudo guardar. Inténtalo de nuevo.", warn: true };
        } else {
          const j = await r.json();
          items = clean(j.items);
        }
      } catch {
        items = prev; view = prevView;
        msg = { text: "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.", warn: true };
      }
      saving = false; render();
      return;
    }
    if (mode === "local") {
      items = nextItems;
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(items)); } catch {}
      if (focusKey) { const [y, m] = focusKey.split("-").map(Number); view = new Date(y, m - 1, 1); }
      pop = popId; render();
      return;
    }
    const prev = items, prevView = view;
    items = nextItems; saving = true;
    if (focusKey) { const [y, m] = focusKey.split("-").map(Number); view = new Date(y, m - 1, 1); }
    pop = popId; render();
    try { sessionStorage.setItem(STASH_KEY, JSON.stringify({ view: keyOf(view), pop: popId })); } catch {}
    try {
      await art.publish(buildDoc(nextItems)); // la página se recarga con la versión nueva
    } catch (e) {
      try { sessionStorage.removeItem(STASH_KEY); } catch {}
      saving = false; items = prev; view = prevView;
      const code = e && e.code;
      if (code === "conflict") msg = { text: "Alguien más actualizó el conteo al mismo tiempo. La página se está recargando; vuelve a agregarlo en un momento.", warn: true };
      else if (code === "not_writer" || code === "not_granted") canWrite = false;
      else if (code === "too_large") msg = { text: "La página llegó a su tamaño máximo. Borra contenidos antiguos para seguir registrando.", warn: true };
      else msg = { text: "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.", warn: true };
      render();
    }
  }

  // ---------- eventos ----------
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (saving || canWrite !== true) return;
    const title = $("fTitle").value.trim();
    const date = $("fDate").value;
    if (!title || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    const [y, m] = date.split("-").map(Number);
    const k = date.slice(0, 7);
    if (y * 12 + m - 1 < monthIndex(CONTRACT_START)) { msg = { text: "El contrato empieza en julio 2026. Elige una fecha desde el 1 de julio.", warn: true }; render(); return; }
    if (monthItems(k).length >= MONTHLY_TOTAL) { msg = { text: `${MONTHS[m - 1]} ya tiene sus ${MONTHLY_TOTAL} contenidos completos.`, warn: true }; render(); return; }
    const item = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title, type: $("fType").value, ads: $("fAds").checked, date, createdAt: new Date().toISOString() };
    $("fAds").checked = false;
    $("fTitle").value = "";
    commit({ action: "add", item }, [...items, item], k, item.id);
  });

  $("list").addEventListener("click", (e) => {
    const x = e.target.closest(".x");
    if (x) { pendingDelete = x.dataset.id; render(); return; }
    const ad = e.target.closest("[data-ad]");
    if (ad) {
      if (saving) return;
      const cur = items.find((i) => i.id === ad.dataset.ad);
      if (!cur) return;
      const ads = !cur.ads;
      commit({ action: "update", id: cur.id, ads }, items.map((i) => (i.id === cur.id ? { ...i, ads } : i)));
      return;
    }
    if (e.target.closest("[data-no]")) { pendingDelete = null; render(); return; }
    const yes = e.target.closest("[data-yes]");
    if (yes) { pendingDelete = null; commit({ action: "delete", id: yes.dataset.yes }, items.filter((i) => i.id !== yes.dataset.yes)); }
  });

  const goTo = (d) => {
    if (monthIndex(d) < monthIndex(CONTRACT_START)) d = CONTRACT_START;
    view = new Date(d.getFullYear(), d.getMonth(), 1);
    pendingDelete = null; msg = { text: "", warn: false };
    $("fDate").value = "";
    render();
  };
  const openCol = (el) => { const c = el.closest(".col"); if (c) { const mi = +c.dataset.mi; goTo(new Date(Math.floor(mi / 12), mi % 12, 1)); } };
  $("history").addEventListener("click", (e) => openCol(e.target));
  $("history").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCol(e.target); } });
  $("prev").addEventListener("click", () => goTo(new Date(view.getFullYear(), view.getMonth() - 1, 1)));
  $("next").addEventListener("click", () => goTo(new Date(view.getFullYear(), view.getMonth() + 1, 1)));
  $("today").addEventListener("click", () => goTo(new Date()));
  // si la página queda abierta al cambiar de día, se actualiza sola
  setInterval(() => { if (isoOf(new Date()) !== isoOf(today)) render(); }, 60000);

  // ---------- Netlify: clave del equipo y actualización automática ----------
  async function refresh() {
    if (saving) return;
    try {
      const r = await fetch(API, { cache: "no-store" });
      if (!r.ok) return;
      const j = await r.json();
      if (!saving && Array.isArray(j.items) && JSON.stringify(j.items) !== JSON.stringify(items)) { items = clean(j.items); render(); }
    } catch {}
  }
  function lock() {
    editKey = ""; canWrite = false;
    try { localStorage.removeItem(KEY_STORE); } catch {}
  }
  $("unlock").addEventListener("submit", async (e) => {
    e.preventDefault();
    const key = $("fKey").value.trim();
    if (!key) return;
    $("unlockBtn").disabled = true;
    try {
      const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "check", key }) });
      if (r.ok) {
        editKey = key; canWrite = true; msg = { text: "", warn: false };
        try { localStorage.setItem(KEY_STORE, key); } catch {}
        $("fKey").value = "";
      } else msg = { text: "Esa clave no es correcta.", warn: true };
    } catch { msg = { text: "No se pudo verificar la clave. Revisa tu conexión.", warn: true }; }
    $("unlockBtn").disabled = false;
    render();
  });
  $("lockOut").addEventListener("click", () => { lock(); render(); });

  // ---------- arranque ----------
  async function start() {
    render();
    const c = window.claude;
    if ((!c || typeof c.use !== "function") && /^https?:$/.test(location.protocol)) {
      // publicado en Netlify: el conteo vive en el servicio de guardado
      try {
        const r = await fetch(API, { cache: "no-store" });
        if (r.ok) {
          const j = await r.json();
          mode = "remote";
          if (Array.isArray(j.items)) items = clean(j.items);
          try { editKey = localStorage.getItem(KEY_STORE) || ""; } catch {}
          canWrite = !!editKey;
          render();
          setInterval(refresh, 20000);
          document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
          return;
        }
      } catch {}
    }
    if (!c || typeof c.use !== "function") {
      // abierto como archivo: guarda en este navegador
      mode = "local"; canWrite = true;
      try { const saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || "null"); if (Array.isArray(saved)) items = clean(saved); } catch {}
      render();
      return;
    }
    const [a, user] = await Promise.all([c.use("artifact"), c.use("user")]);
    mode = "artifact";
    if (!a) { canWrite = false; render(); return; }
    art = a;
    let edit = null;
    try { edit = user ? await user.canEdit() : null; } catch {}
    canWrite = edit !== false;
    render();
  }
  start();
})();
</script>
</body>
</html>
